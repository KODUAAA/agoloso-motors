<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Car details | Agoloso Motors</title>
    <link rel="icon" href="/img/brand/icon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/img/brand/icon-512.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/img/brand/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@600;700;800&family=Fira+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/site.css" />
    <script src="/js/boot.js"></script>
    <script type="module" src="/js/motion.js"></script>
    <script type="module" src="/js/vehicle.js"></script>
  </head>
  <body class="site no-hero">
    <header class="site-header is-solid">
      <div class="wrap">
        <a class="brand" href="/"><img src="/img/brand/logo.webp" alt="Agoloso Motors" width="657" height="452" /></a>
        <nav class="site-nav" aria-label="Main">
          <a href="/#cars">Cars</a>
          <a href="/find">Find me a car</a>
          <a href="/#finance">Finance</a>
          <a href="/#visit">Visit us</a>
        </nav>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-menu" aria-label="Open menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <nav class="mobile-menu" id="mobile-menu" aria-label="Main">
      <ul>
        <li><a href="/#cars">Cars</a></li>
        <li><a href="/find">Find me a car</a></li>
        <li><a href="/#finance">Finance</a></li>
        <li><a href="/#visit">Visit us</a></li>
        <li><a href="/#contact">Contact</a></li>
      </ul>
      <p class="menu-foot">Open Monday to Saturday</p>
    </nav>

    <main class="wrap" id="main">
      <p class="crumbs"><a href="/#cars">All cars</a></p>
      <div id="vehicle-root" aria-busy="true">
        <div class="vehicle">
          <div class="skeleton" style="min-height: 420px"></div>
          <div class="skeleton" style="min-height: 420px"></div>
        </div>
      </div>
    </main>

    <template id="action-forms">
      <div class="actions-panel">
        <div class="tabs" role="tablist" aria-label="What would you like to do?">
          <button role="tab" id="tab-enquiry" aria-controls="panel-enquiry" aria-selected="true">Ask a question</button>
          <button role="tab" id="tab-test-drive" aria-controls="panel-test-drive" aria-selected="false" tabindex="-1">Book a test drive</button>
          <button role="tab" id="tab-finance" aria-controls="panel-finance" aria-selected="false" tabindex="-1">Apply for finance</button>
        </div>

        <form class="tab-panel" role="tabpanel" id="panel-enquiry" aria-labelledby="tab-enquiry" data-type="enquiry" novalidate>
          <div class="form-grid">
            <label class="field">Name
              <input name="name" autocomplete="name" required maxlength="100" />
              <span class="field-error" data-error-for="name"></span>
            </label>
            <label class="field">Email
              <input name="email" type="email" autocomplete="email" required />
              <span class="field-error" data-error-for="email"></span>
            </label>
            <label class="field span-2">Phone <span class="field-hint">(optional)</span>
              <input name="phone" type="tel" autocomplete="tel" />
              <span class="field-error" data-error-for="phone"></span>
            </label>
            <label class="field span-2">Your question
              <textarea name="message" maxlength="2000"></textarea>
              <span class="field-error" data-error-for="message"></span>
            </label>
          </div>
          <label class="honeypot" aria-hidden="true">Website <input name="website" tabindex="-1" autocomplete="off" /></label>
          <div class="form-status" role="status"></div>
          <div><button class="btn btn-primary" type="submit">Send question</button></div>
        </form>

        <form class="tab-panel" role="tabpanel" id="panel-test-drive" aria-labelledby="tab-test-drive" data-type="test_drive" hidden novalidate>
          <div class="form-grid">
            <label class="field">Name
              <input name="name" autocomplete="name" required maxlength="100" />
              <span class="field-error" data-error-for="name"></span>
            </label>
            <label class="field">Email
              <input name="email" type="email" autocomplete="email" required />
              <span class="field-error" data-error-for="email"></span>
            </label>
            <label class="field">Phone
              <input name="phone" type="tel" autocomplete="tel" required />
              <span class="field-error" data-error-for="phone"></span>
            </label>
            <label class="field">Preferred date
              <input name="preferred_date" type="date" required />
              <span class="field-error" data-error-for="preferred_date"></span>
            </label>
            <label class="field span-2">Anything we should know? <span class="field-hint">(optional)</span>
              <textarea name="message" maxlength="2000"></textarea>
            </label>
          </div>
          <label class="honeypot" aria-hidden="true">Website <input name="website" tabindex="-1" autocomplete="off" /></label>
          <div class="form-status" role="status"></div>
          <div><button class="btn btn-primary" type="submit">Book test drive</button></div>
        </form>

        <form class="tab-panel" role="tabpanel" id="panel-finance" aria-labelledby="tab-finance" data-type="finance" hidden novalidate>
          <div class="form-grid">
            <label class="field">Deposit
              <input name="deposit" type="number" min="0" step="100" value="0" inputmode="numeric" />
              <span class="field-error" data-error-for="deposit"></span>
            </label>
            <label class="field">Pay over
              <select name="term_months"></select>
              <span class="field-error" data-error-for="term_months"></span>
            </label>
            <p class="mini-quote span-2" id="finance-quote" aria-live="polite"></p>
            <label class="field">Name
              <input name="name" autocomplete="name" required maxlength="100" />
              <span class="field-error" data-error-for="name"></span>
            </label>
            <label class="field">Email
              <input name="email" type="email" autocomplete="email" required />
              <span class="field-error" data-error-for="email"></span>
            </label>
            <label class="field">Phone
              <input name="phone" type="tel" autocomplete="tel" required />
              <span class="field-error" data-error-for="phone"></span>
            </label>
            <label class="field">Employment
              <select name="employment_status" required>
                <option value="">Choose one</option>
                <option value="employed">Employed</option>
                <option value="self_employed">Self-employed</option>
                <option value="retired">Retired</option>
                <option value="student">Student</option>
                <option value="unemployed">Not working</option>
              </select>
              <span class="field-error" data-error-for="employment_status"></span>
            </label>
            <label class="field span-2">Monthly income after tax
              <input name="monthly_income" type="number" min="0" step="100" required inputmode="numeric" />
              <span class="field-error" data-error-for="monthly_income"></span>
            </label>
            <label class="check span-2">
              <input type="checkbox" name="consent" required />
              <span>I agree to Agoloso Motors contacting me about this application and running the checks needed to arrange finance.</span>
            </label>
            <span class="field-error span-2" data-error-for="consent"></span>
          </div>
          <label class="honeypot" aria-hidden="true">Website <input name="website" tabindex="-1" autocomplete="off" /></label>
          <div class="form-status" role="status"></div>
          <div><button class="btn btn-primary" type="submit">Send application</button></div>
        </form>
      </div>
    </template>

    <footer class="site-footer">
      <div class="wrap">
        <div class="footer-brand"><a class="brand brand-footer" href="/"><img src="/img/brand/logo.webp" alt="Agoloso Motors" width="657" height="452" /></a><p>&copy; <span id="year"></span> Agoloso Motors</p></div>
        <a href="/admin/">Staff sign in</a>
      </div>
    </footer>
  </body>
</html>
